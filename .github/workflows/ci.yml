name: CI/CD

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-deploy:
    name: "Compilation, tests et build d'images Docker"
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:5.0.8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ ping: 1 })'" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Configuration du JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Mise en cache des dépendances Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compilation et exécution des tests Maven
        run: mvn clean install --batch-mode

      # Vérification que les jar sont bien générés pour chaque service
      - name: Lister notes-service/target
        run: ls -la notes-service/target
      - name: Lister risk-assessment-service/target
        run: ls -la risk-assessment-service/target
      - name: Lister gateway-service/target
        run: ls -la gateway-service/target
      - name: Lister front-service/target
        run: ls -la front-service/target
      - name: Lister patient-service/target
        run: ls -la patient-service/target

      - name: Connexion au registre GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: Bibarss
          password: ${{ secrets.CR_PAT }}

      - name: Définir le propriétaire en minuscules
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & push de l'image notes-service
        uses: docker/build-push-action@v4
        with:
          context: ./notes-service
          file: ./notes-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/notes-service:latest

      - name: Build & push de l'image patient-service
        uses: docker/build-push-action@v4
        with:
          context: ./patient-service
          file: ./patient-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/patient-service:latest

      - name: Build & push de l'image front-service
        uses: docker/build-push-action@v4
        with:
          context: ./front-service
          file: ./front-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/front-service:latest

      - name: Build & push de l'image gateway-service
        uses: docker/build-push-action@v4
        with:
          context: ./gateway-service
          file: ./gateway-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/gateway-service:latest

      - name: Build & push de l'image risk-assessment-service
        uses: docker/build-push-action@v4
        with:
          context: ./risk-assessment-service
          file: ./risk-assessment-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/risk-assessment-service:latest

  deploy:
    name: "Déploiement en production"
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Déploiement via Docker Compose
        run: |
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d
