
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${patient.id} != null ? 'Modifier le patient' : 'Ajouter un patient'">Formulaire Patient</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007acc;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        .container {
            width: 50%;
            max-width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
        }
        form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        form input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        form button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
        }
        .footer a {
            text-decoration: none;
            color: #007acc;
        }
    </style>
</head>
<body>
<header>
    <h1 th:text="${patient.id} != null ? 'Modifier le patient' : 'Ajouter un patient'">Formulaire Patient</h1>
</header>
<div class="container">
    <div th:if="${error}" class="error">
        <p th:text="${error}"></p>
    </div>
    <form th:action="${patient.id} != null ? @{'/patients/edit'} : @{'/patients/add'}" th:object="${patient}" method="post">
        <div th:if="${patient.id} != null">
            <input type="hidden" th:field="*{id}" />
        </div>
        <label>Prénom :</label>
        <input type="text" th:field="*{prenom}" required/>

        <label>Nom :</label>
        <input type="text" th:field="*{nom}" required/>

        <label>Date de naissance :</label>
        <input type="date" th:field="*{dateNaissance}" required/>
        <!--th:value="${patient.dateNaissance} != null ? ${#temporals.format(patient.dateNaissance, 'yyyy-MM-dd')} : ''" required/> -->

        <label>Genre :</label>
        <input type="text" th:field="*{genre}" required/>

        <label>Adresse postale (optionnel) :</label>
        <input type="text" th:field="*{adressePostale}"/>

        <label>Numéro de téléphone (optionnel) :</label>
        <input type="text" th:field="*{numeroTelephone}"/>

        <button type="submit">Envoyer</button>
    </form>
    <div class="footer">
        <a href="/patients">Retour à la liste</a>
    </div>
</div>
</body>
</html>
