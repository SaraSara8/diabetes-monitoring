<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rapport de Risque de Diabète</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007acc;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        .container {
            width: 50%;
            max-width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 100%;
        }
        table th, table td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: center;
        }
        table th {
            background-color: #007acc;
            color: white;
        }
        .footer {
            margin-top: 20px;
        }
        .footer a {
            text-decoration: none;
            color: #007acc;
        }
        .error {
            color: red;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<header>
    <h1>Rapport de Risque de Diabète</h1>
</header>
<div class="container">
    <div th:if="${riskReport == null}">
        <p>Aucun rapport disponible pour ce patient.</p>
    </div>
    <div th:if="${riskReport != null}">
        <table>
            <tr>
                <th>ID du Patient</th>
                <td th:text="${riskReport.patientId}">ID</td>
            </tr>
            <tr>
                <th>Prénom</th>
                <td th:text="${riskReport.patientPrenom}">Prénom</td>
            </tr>
            <tr>
                <th>Nom</th>
                <td th:text="${riskReport.patientNom}">Nom</td>
            </tr>
            <tr>
                <th>Niveau de Risque</th>
                <td th:text="${riskReport.riskLevel}">Niveau</td>
            </tr>
            <tr>
                <th>Nombre de Déclencheurs</th>
                <td th:text="${riskReport.triggerCount}">Nombre</td>
            </tr>
        </table>
    </div>
    <div class="footer">
        <a href="/patients">Retour à la liste des patients</a>
    </div>
</div>
</body>
</html>
